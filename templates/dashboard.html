<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 18px; height: 18px; }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: #111827; }
    .nav { display: flex; gap: 8px; }
    .nav a { font-size: 0.85rem; color: #6b7280; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: 500; }
    .nav a:hover { background: #f3f4f6; color: #111827; }
    .nav a.active { background: #ede9fe; color: #7c3aed; }

    /* ── Main ── */
    .main { max-width: 1300px; margin: 0 auto; padding: 32px 24px; }

    /* ── Stats ── */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: #fff; border-radius: 14px;
      padding: 20px 24px; border: 1px solid #e5e7eb;
    }
    .stat-label { font-size: 0.78rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #111827; line-height: 1; }
    .stat-sub   { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }

    /* ── Toolbar ── */
    .toolbar {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
      padding: 16px 20px; display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; margin-bottom: 16px;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #9ca3af; pointer-events: none;
    }
    .search-wrap input {
      width: 100%; padding: 9px 12px 9px 36px; border: 1.5px solid #e5e7eb;
      border-radius: 9px; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s; color: #111827;
    }
    .search-wrap input:focus { border-color: #667eea; }
    .date-group { display: flex; align-items: center; gap: 8px; }
    .date-group label { font-size: 0.82rem; color: #6b7280; font-weight: 500; white-space: nowrap; }
    .date-group input[type="date"] {
      padding: 8px 10px; border: 1.5px solid #e5e7eb; border-radius: 9px;
      font-size: 0.88rem; outline: none; color: #111827; transition: border-color 0.2s;
    }
    .date-group input[type="date"]:focus { border-color: #667eea; }
    .clear-btn {
      padding: 8px 14px; background: #f3f4f6; border: 1px solid #e5e7eb;
      border-radius: 9px; font-size: 0.85rem; color: #6b7280;
      cursor: pointer; font-weight: 500; white-space: nowrap;
    }
    .clear-btn:hover { background: #e5e7eb; color: #374151; }

    /* ── Table ── */
    .table-wrap {
      background: #fff; border: 1px solid #e5e7eb;
      border-radius: 14px; overflow: hidden;
    }
    .table-header {
      padding: 14px 20px; border-bottom: 1px solid #f3f4f6;
      display: flex; align-items: center; justify-content: space-between;
    }
    .table-title { font-size: 0.9rem; font-weight: 600; color: #374151; }
    .count-badge {
      background: #f3f4f6; color: #6b7280; font-size: 0.78rem;
      font-weight: 600; padding: 3px 10px; border-radius: 20px;
    }

    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    thead th {
      padding: 11px 14px; text-align: left; font-size: 0.73rem; font-weight: 700;
      color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em;
      background: #f9fafb; border-bottom: 1px solid #e5e7eb; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f3f4f6; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody td { padding: 12px 14px; font-size: 0.875rem; color: #374151; vertical-align: middle; }

    .name-cell  { font-weight: 600; color: #111827; white-space: nowrap; }
    .email-cell { color: #667eea; }

    /* Source badges — manual */
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px;
      font-size: 0.73rem; font-weight: 600; white-space: nowrap;
    }
    .src-Direct        { background: #f3f4f6; color: #6b7280; }
    .src-Google        { background: #fef3c7; color: #d97706; }
    .src-Social        { background: #ede9fe; color: #7c3aed; }
    .src-Referral      { background: #d1fae5; color: #059669; }
    .src-Email         { background: #dbeafe; color: #2563eb; }
    .src-Other         { background: #fce7f3; color: #db2777; }
    /* UTM source badge */
    .utm-badge         { background: #ecfdf5; color: #065f46; }
    .utm-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 20px; padding: 2px 8px;
      font-size: 0.7rem; font-weight: 600; color: #166534;
      white-space: nowrap;
    }
    .utm-pill .dot {
      width: 5px; height: 5px; background: #16a34a;
      border-radius: 50%; flex-shrink: 0;
    }

    /* UTM detail cell */
    .utm-cell { font-size: 0.8rem; color: #6b7280; }
    .utm-line { display: flex; flex-direction: column; gap: 2px; }
    .utm-kv   { display: flex; gap: 4px; }
    .utm-key  { color: #9ca3af; font-size: 0.7rem; min-width: 52px; }
    .utm-val  { color: #374151; font-weight: 500; }
    .no-utm   { color: #d1d5db; font-size: 0.78rem; font-style: italic; }

    .date-cell { color: #9ca3af; font-size: 0.82rem; white-space: nowrap; }

    /* ── Empty / Loading ── */
    .state-row td { text-align: center; padding: 60px 20px; color: #9ca3af; font-size: 0.95rem; }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid #e5e7eb; border-top-color: #667eea;
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1>Contacts Dashboard</h1>
    </div>
    <nav class="nav">
      <a href="/">Form</a>
      <a href="/dashboard" class="active">Contacts</a>
      <a href="/sequences">Sequences</a>
      <a href="/analytics">Analytics</a>
    </nav>
  </header>

  <main class="main">

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Contacts</div>
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-sub">all time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">New Today</div>
        <div class="stat-value" id="stat-today">—</div>
        <div class="stat-sub" id="stat-today-date">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">UTM Tracked</div>
        <div class="stat-value" id="stat-utm">—</div>
        <div class="stat-sub">have UTM data</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Showing</div>
        <div class="stat-value" id="stat-filtered">—</div>
        <div class="stat-sub">matching filters</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search" placeholder="Search name, email, phone, UTM source or campaign…" />
      </div>
      <div class="date-group">
        <label>From</label>
        <input type="date" id="date-from" />
      </div>
      <div class="date-group">
        <label>To</label>
        <input type="date" id="date-to" />
      </div>
      <button class="clear-btn" id="clear-btn">Clear</button>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">All Contacts</span>
        <span class="count-badge" id="count-badge">0 contacts</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Source</th>
              <th>UTM Details</th>
              <th>Emails</th>
              <th>Signed Up</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr class="state-row"><td colspan="7"><span class="spinner"></span> Loading contacts…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const searchEl      = document.getElementById('search');
    const fromEl        = document.getElementById('date-from');
    const toEl          = document.getElementById('date-to');
    const clearBtn      = document.getElementById('clear-btn');
    const tbody         = document.getElementById('tbody');
    const badge         = document.getElementById('count-badge');
    const statTotal     = document.getElementById('stat-total');
    const statToday     = document.getElementById('stat-today');
    const statUtm       = document.getElementById('stat-utm');
    const statFiltered  = document.getElementById('stat-filtered');
    const statTodayDate = document.getElementById('stat-today-date');

    let timer = null;

    const SRC_CLASS = {
      'Direct':         'src-Direct',
      'Google Search':  'src-Google',
      'Social Media':   'src-Social',
      'Referral':       'src-Referral',
      'Email Campaign': 'src-Email',
      'Other':          'src-Other',
    };

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function sourceCell(c) {
      // Prefer utm_source as the primary source badge; fall back to manual dropdown
      if (c.utm_source) {
        return `<span class="utm-pill"><span class="dot"></span>${escHtml(c.utm_source)}</span>`;
      }
      const src = c.source || 'Direct';
      const cls = SRC_CLASS[src] || 'src-Other';
      return `<span class="badge ${cls}">${escHtml(src)}</span>`;
    }

    function emailCell(c) {
      const sent    = c.emails_sent    || 0;
      const opened  = c.emails_opened  || 0;
      const clicked = c.emails_clicked || 0;
      if (!sent) return '<span style="color:#d1d5db;font-size:0.78rem">none sent</span>';
      const parts = [`<span style="font-size:0.78rem;color:#6b7280">${sent} sent</span>`];
      if (opened)  parts.push(`<span style="font-size:0.72rem;background:#d1fae5;color:#065f46;padding:2px 7px;border-radius:20px;font-weight:600">👁 ${opened}</span>`);
      if (clicked) parts.push(`<span style="font-size:0.72rem;background:#dbeafe;color:#1e40af;padding:2px 7px;border-radius:20px;font-weight:600">🔗 ${clicked}</span>`);
      return `<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">${parts.join('')}</div>`;
    }

    function utmCell(c) {
      const rows = [
        ['source',   c.utm_source],
        ['medium',   c.utm_medium],
        ['campaign', c.utm_campaign],
        ['term',     c.utm_term],
        ['content',  c.utm_content],
      ].filter(([, v]) => v);

      if (rows.length === 0) return '<span class="no-utm">no UTM data</span>';

      return `<div class="utm-line">${rows.map(([k, v]) =>
        `<div class="utm-kv"><span class="utm-key">${k}</span><span class="utm-val">${escHtml(v)}</span></div>`
      ).join('')}</div>`;
    }

    function render(contacts) {
      statFiltered.textContent = contacts.length;
      badge.textContent = contacts.length + ' contact' + (contacts.length !== 1 ? 's' : '');

      if (contacts.length === 0) {
        tbody.innerHTML = '<tr class="state-row"><td colspan="7">No contacts found.</td></tr>';
        return;
      }

      tbody.innerHTML = contacts.map(c => `<tr>
        <td class="name-cell">${escHtml(c.first_name + ' ' + c.last_name)}</td>
        <td class="email-cell">${escHtml(c.email)}</td>
        <td>${escHtml(c.phone)}</td>
        <td>${sourceCell(c)}</td>
        <td class="utm-cell">${utmCell(c)}</td>
        <td>${emailCell(c)}</td>
        <td class="date-cell">${c.created_at || '—'}</td>
      </tr>`).join('');
    }

    async function fetchContacts() {
      const q    = searchEl.value.trim();
      const from = fromEl.value;
      const to   = toEl.value;
      const p    = new URLSearchParams();
      if (q)    p.set('q', q);
      if (from) p.set('from', from);
      if (to)   p.set('to', to);

      tbody.innerHTML = '<tr class="state-row"><td colspan="7"><span class="spinner"></span> Loading…</td></tr>';
      try {
        const res = await fetch('/api/contacts?' + p);
        render(await res.json());
      } catch {
        tbody.innerHTML = '<tr class="state-row"><td colspan="7">Failed to load contacts.</td></tr>';
      }
    }

    async function loadStats() {
      try {
        const all = await (await fetch('/api/contacts')).json();
        statTotal.textContent = all.length;
        statUtm.textContent   = all.filter(c => c.utm_source).length;
        const today = new Date().toISOString().slice(0, 10);
        statTodayDate.textContent = today;
        statToday.textContent = all.filter(c => c.created_at && c.created_at.startsWith(today)).length;
      } catch {
        statTotal.textContent = statToday.textContent = statUtm.textContent = '—';
      }
    }

    function debounce(fn) { clearTimeout(timer); timer = setTimeout(fn, 300); }

    searchEl.addEventListener('input',  () => debounce(fetchContacts));
    fromEl.addEventListener('change',   fetchContacts);
    toEl.addEventListener('change',     fetchContacts);
    clearBtn.addEventListener('click',  () => {
      searchEl.value = fromEl.value = toEl.value = '';
      fetchContacts();
    });

    loadStats();
    fetchContacts();
  </script>
</body>
</html>
