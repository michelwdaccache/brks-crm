<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f3f4f6; color: #1f2937; min-height: 100vh; }

    .header {
      background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 32px;
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { width: 36px; height: 36px; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 18px; height: 18px; }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: #111827; }
    .nav { display: flex; gap: 8px; }
    .nav a { font-size: 0.85rem; color: #6b7280; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: 500; }
    .nav a:hover { background: #f3f4f6; color: #111827; }
    .nav a.active { background: #ede9fe; color: #7c3aed; }

    .main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* stat cards */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px 24px; }
    .stat-label { font-size: 0.75rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #111827; line-height: 1; }
    .stat-sub   { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }
    .stat-card.green .stat-value { color: #059669; }
    .stat-card.purple .stat-value { color: #7c3aed; }
    .stat-card.blue .stat-value { color: #2563eb; }

    /* two-col grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; }
    .panel-header { padding: 16px 20px; border-bottom: 1px solid #f3f4f6; }
    .panel-header h3 { font-size: 0.95rem; font-weight: 700; color: #111827; }
    .panel-header p  { font-size: 0.8rem; color: #9ca3af; margin-top: 2px; }
    .panel-body { padding: 20px; }

    /* per-template table */
    .tmpl-table { width: 100%; border-collapse: collapse; }
    .tmpl-table th {
      text-align: left; font-size: 0.72rem; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 8px 12px; border-bottom: 1px solid #e5e7eb; background: #f9fafb;
    }
    .tmpl-table td { padding: 12px; font-size: 0.875rem; border-bottom: 1px solid #f3f4f6; }
    .tmpl-table tr:last-child td { border-bottom: none; }
    .tmpl-name { font-weight: 600; color: #111827; }
    .delay-chip { font-size: 0.72rem; background: #ede9fe; color: #7c3aed; padding: 2px 8px; border-radius: 20px; font-weight: 600; margin-left: 6px; }

    /* rate bar */
    .rate-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .rate-bar-bg { flex: 1; height: 6px; background: #f3f4f6; border-radius: 3px; overflow: hidden; }
    .rate-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .rate-bar-fill.green  { background: #10b981; }
    .rate-bar-fill.purple { background: #8b5cf6; }
    .rate-label { font-size: 0.8rem; font-weight: 600; min-width: 36px; text-align: right; }

    /* events table */
    .events-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .events-table { width: 100%; border-collapse: collapse; }
    .events-table th {
      text-align: left; font-size: 0.72rem; font-weight: 700; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 16px;
      background: #f9fafb; border-bottom: 1px solid #e5e7eb;
    }
    .events-table td { padding: 11px 16px; font-size: 0.86rem; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
    .events-table tr:last-child td { border-bottom: none; }
    .event-type {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 0.73rem; font-weight: 700;
    }
    .event-open  { background: #d1fae5; color: #065f46; }
    .event-click { background: #dbeafe; color: #1e40af; }
    .url-cell { font-size: 0.78rem; color: #6b7280; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .name-cell { font-weight: 600; color: #111827; }
    .time-cell { color: #9ca3af; font-size: 0.78rem; white-space: nowrap; }

    .empty { text-align: center; padding: 40px; color: #9ca3af; font-size: 0.9rem; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </div>
      <h1>Email Analytics</h1>
    </div>
    <nav class="nav">
      <a href="/">Form</a>
      <a href="/dashboard">Contacts</a>
      <a href="/sequences">Sequences</a>
      <a href="/analytics" class="active">Analytics</a>
    </nav>
  </header>

  <main class="main">

    <!-- Overall stats -->
    <div class="stats" id="stats">
      <div class="loading" style="grid-column:1/-1"><span class="spinner"></span></div>
    </div>

    <!-- Chart + Per-template -->
    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">
          <h3>Emails sent — last 30 days</h3>
          <p>Daily send volume</p>
        </div>
        <div class="panel-body">
          <canvas id="chart" height="200"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h3>Performance by template</h3>
          <p>Open and click rates per email</p>
        </div>
        <div class="panel-body" id="tmpl-body">
          <div class="loading"><span class="spinner"></span></div>
        </div>
      </div>
    </div>

    <!-- Recent events -->
    <div class="events-panel">
      <div class="panel-header">
        <h3>Recent activity</h3>
        <p>Latest opens and clicks across all contacts</p>
      </div>
      <div id="events-body">
        <div class="loading"><span class="spinner"></span></div>
      </div>
    </div>

  </main>

  <script>
    function pct(n, d) { return d ? Math.round((n/d)*100) + '%' : '0%'; }
    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let chartInst = null;

    async function load() {
      const res  = await fetch('/api/analytics');
      const data = await res.json();
      renderStats(data.overall);
      renderChart(data.by_day);
      renderTemplates(data.by_template);
      renderEvents(data.recent_events);
    }

    function renderStats(o) {
      const sent    = o.total_sent    || 0;
      const opened  = o.total_opened  || 0;
      const clicked = o.total_clicked || 0;
      const openRate  = pct(opened,  sent);
      const clickRate = pct(clicked, sent);

      document.getElementById('stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Sent</div>
          <div class="stat-value">${sent}</div>
          <div class="stat-sub">emails delivered</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">Open Rate</div>
          <div class="stat-value">${openRate}</div>
          <div class="stat-sub">${opened} unique opens</div>
        </div>
        <div class="stat-card purple">
          <div class="stat-label">Click Rate</div>
          <div class="stat-value">${clickRate}</div>
          <div class="stat-sub">${clicked} unique clicks</div>
        </div>
        <div class="stat-card blue">
          <div class="stat-label">Click-to-Open</div>
          <div class="stat-value">${pct(clicked, opened)}</div>
          <div class="stat-sub">of openers clicked</div>
        </div>`;
    }

    function renderChart(byDay) {
      const labels = byDay.map(d => d.day);
      const values = byDay.map(d => d.n);

      if (chartInst) chartInst.destroy();
      const ctx = document.getElementById('chart').getContext('2d');

      if (!labels.length) {
        ctx.canvas.parentElement.innerHTML = '<p class="empty">No emails sent yet.</p>';
        return;
      }

      chartInst = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Emails sent',
            data: values,
            backgroundColor: 'rgba(102,126,234,0.8)',
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#f3f4f6' } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function renderTemplates(templates) {
      if (!templates.length) {
        document.getElementById('tmpl-body').innerHTML = '<p class="empty">No template data yet.</p>';
        return;
      }
      const rows = templates.map(t => {
        const openPct  = t.sent ? Math.round((t.opened  / t.sent) * 100) : 0;
        const clickPct = t.sent ? Math.round((t.clicked / t.sent) * 100) : 0;
        const delay    = t.delay_days === 0 ? 'Immediate' : `Day ${t.delay_days}`;
        return `<tr>
          <td>
            <span class="tmpl-name">${escHtml(t.name)}</span>
            <span class="delay-chip">${delay}</span>
            ${!t.active ? '<span style="font-size:0.72rem;color:#ef4444;margin-left:4px">Inactive</span>' : ''}
          </td>
          <td style="color:#374151;font-weight:600">${t.sent}</td>
          <td style="min-width:140px">
            <div class="rate-bar-wrap">
              <div class="rate-bar-bg"><div class="rate-bar-fill green" style="width:${openPct}%"></div></div>
              <span class="rate-label" style="color:#059669">${openPct}%</span>
            </div>
          </td>
          <td style="min-width:140px">
            <div class="rate-bar-wrap">
              <div class="rate-bar-bg"><div class="rate-bar-fill purple" style="width:${clickPct}%"></div></div>
              <span class="rate-label" style="color:#7c3aed">${clickPct}%</span>
            </div>
          </td>
        </tr>`;
      }).join('');

      document.getElementById('tmpl-body').innerHTML = `
        <table class="tmpl-table">
          <thead><tr><th>Template</th><th>Sent</th><th>Open rate</th><th>Click rate</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function renderEvents(events) {
      if (!events.length) {
        document.getElementById('events-body').innerHTML = '<p class="empty">No tracking events yet. Send some emails first.</p>';
        return;
      }
      const rows = events.map(e => {
        const typeHtml = e.event_type === 'open'
          ? '<span class="event-type event-open">👁 Open</span>'
          : '<span class="event-type event-click">🔗 Click</span>';
        const urlHtml = e.url
          ? `<span class="url-cell" title="${escHtml(e.url)}">${escHtml(e.url)}</span>`
          : '<span style="color:#d1d5db">—</span>';
        return `<tr>
          <td>${typeHtml}</td>
          <td class="name-cell">${escHtml(e.first_name + ' ' + e.last_name)}</td>
          <td style="color:#667eea">${escHtml(e.email)}</td>
          <td style="color:#6b7280;font-size:0.82rem">${escHtml(e.template_name)}</td>
          <td>${urlHtml}</td>
          <td class="time-cell">${e.created_at}</td>
        </tr>`;
      }).join('');

      document.getElementById('events-body').innerHTML = `
        <table class="events-table">
          <thead><tr><th>Event</th><th>Contact</th><th>Email</th><th>Template</th><th>URL clicked</th><th>Time</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    load();
  </script>
</body>
</html>
